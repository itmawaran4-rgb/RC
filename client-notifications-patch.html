<!-- ════ 1) CSS — أضفه داخل <style> ════ -->
<style>
/* ── NOTIFICATIONS FROM WORKSHOP ── */
.notif-inbox-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.notif-inbox-header {
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: var(--tr);
}
.notif-inbox-header:hover { background: rgba(245,166,35,.03); }
.notif-inbox-title {
  font-size: 15px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
}
.notif-inbox-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  background: var(--red);
  color: #fff;
  font-size: 11px;
  font-weight: 900;
  padding: 0 5px;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}
.notif-inbox-body {
  display: none;
  border-top: 1px solid var(--border);
  padding: 0;
}
.notif-inbox-body.open { display: block; }
.notif-inbox-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  transition: var(--tr);
  position: relative;
}
.notif-inbox-item:last-child { border-bottom: none; }
.notif-inbox-item.unread {
  background: linear-gradient(135deg, rgba(59,130,246,.06), transparent);
}
.notif-inbox-item.unread::before {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 0; bottom: 0;
  width: 3px;
  background: var(--blue, #3b82f6);
  border-radius: 2px;
}
.notif-item-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.notif-item-center {
  font-size: 12px;
  font-weight: 800;
  color: var(--gold);
}
.notif-item-time {
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}
.notif-item-msg {
  font-size: 13px;
  color: var(--text);
  line-height: 1.55;
}
.notif-item-type {
  display: inline-block;
  margin-top: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 9px;
  border-radius: 20px;
  background: rgba(15,184,148,.1);
  border: 1px solid rgba(15,184,148,.25);
  color: var(--teal);
}
.notif-mark-read-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 10px 16px;
  background: transparent;
  border: none;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: var(--tr);
}
.notif-mark-read-btn:hover { background: rgba(245,166,35,.04); color: var(--gold); }
.notif-empty {
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
}
</style>

<!-- ════ 2) HTML — أضفه داخل .main-content بعد قسم الزيت ════ -->
<!-- WORKSHOP NOTIFICATIONS INBOX -->
<div class="notif-inbox-section" id="notif-inbox-section" style="display:none">
  <div class="notif-inbox-header" onclick="toggleNotifInbox()">
    <div class="notif-inbox-title">
      🔔 <span id="notif-inbox-title-txt">إشعارات من المركز</span>
      <span class="notif-inbox-badge" id="notif-inbox-badge" style="display:none">0</span>
    </div>
    <span style="font-size:14px;color:var(--muted);transition:transform .22s ease" id="notif-inbox-chevron">▼</span>
  </div>
  <div class="notif-inbox-body" id="notif-inbox-body">
    <div id="notif-inbox-list"></div>
    <button class="notif-mark-read-btn" id="notif-mark-read-btn" onclick="markAllNotifsRead()">
      ✓ <span id="notif-mark-read-txt">تحديد الكل كمقروء</span>
    </button>
  </div>
</div>

<!-- ════ 3) JS — أضفه في نهاية <script> قبل آخر سطر ════ -->
<script>
/* ═══════════════════════════════
   WORKSHOP NOTIFICATIONS INBOX
   Collection: notifications
   { user_phone, car_name, type, msg_ar, msg_ku, msg_en,
     center_name, read, timestamp }
═══════════════════════════════ */
let notifInboxOpen = false;
let notifUnreadCount = 0;

async function loadNotifications() {
  if (!user || !user.phone || !firebaseReady) return;
  try {
    const snap = await db.collection('notifications')
      .where('user_phone', '==', user.phone)
      .orderBy('timestamp', 'desc')
      .limit(20)
      .get();

    if (snap.empty) return;

    const section = document.getElementById('notif-inbox-section');
    section.style.display = 'block';

    const items = [];
    snap.forEach(d => items.push({ id: d.id, ...d.data() }));

    notifUnreadCount = items.filter(n => !n.read).length;

    const badge = document.getElementById('notif-inbox-badge');
    if (notifUnreadCount > 0) {
      badge.style.display = 'inline-flex';
      badge.textContent = notifUnreadCount > 9 ? '9+' : String(notifUnreadCount);
    } else {
      badge.style.display = 'none';
    }

    renderNotifList(items);
  } catch(e) {
    console.error('loadNotifications:', e);
  }
}

function renderNotifList(items) {
  const t = T[lang] || T['ar'];
  const listEl = document.getElementById('notif-inbox-list');
  if (!items.length) {
    listEl.innerHTML = `<div class="notif-empty">🔔 ${t.noNotif || 'لا توجد إشعارات'}</div>`;
    return;
  }

  const msgKey = lang === 'ku' ? 'msg_ku' : lang === 'en' ? 'msg_en' : 'msg_ar';
  const typeLabels = {
    oil: lang === 'ku' ? '🛢️ گۆڕینی ڕۆن' : lang === 'en' ? '🛢️ Oil Change' : '🛢️ تغيير زيت',
    maint: lang === 'ku' ? '🛠️ پاراستنەوە' : lang === 'en' ? '🛠️ Maintenance' : '🛠️ صيانة',
  };

  listEl.innerHTML = items.map(n => {
    const msg = n[msgKey] || n.msg_ar || '';
    const ts = n.timestamp ? n.timestamp.toDate() : null;
    const timeStr = ts ? ts.toLocaleDateString('ar-IQ') + ' ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    const typeLabel = typeLabels[n.type] || '🔔';
    return `<div class="notif-inbox-item ${n.read ? '' : 'unread'}" id="notif-item-${n.id}">
      <div class="notif-item-top">
        <div class="notif-item-center">🏪 ${n.center_name || 'RC Service'}</div>
        <div class="notif-item-time">${timeStr}</div>
      </div>
      <div class="notif-item-msg">${msg}</div>
      <span class="notif-item-type">${typeLabel}</span>
    </div>`;
  }).join('');
}

function toggleNotifInbox() {
  notifInboxOpen = !notifInboxOpen;
  document.getElementById('notif-inbox-body').classList.toggle('open', notifInboxOpen);
  const ch = document.getElementById('notif-inbox-chevron');
  if (ch) ch.style.transform = notifInboxOpen ? 'rotate(180deg)' : '';
  if (notifInboxOpen) markAllNotifsRead();
}

async function markAllNotifsRead() {
  if (!user || !user.phone || !firebaseReady) return;
  try {
    const snap = await db.collection('notifications')
      .where('user_phone', '==', user.phone)
      .where('read', '==', false)
      .get();
    const batch = db.batch();
    snap.forEach(d => batch.update(d.ref, { read: true }));
    await batch.commit();
    // Update UI
    document.querySelectorAll('.notif-inbox-item.unread').forEach(el => el.classList.remove('unread'));
    const badge = document.getElementById('notif-inbox-badge');
    badge.style.display = 'none';
    notifUnreadCount = 0;
  } catch(e) { console.error('markAllNotifsRead:', e); }
}

// ── إضافة مفاتيح ترجمة الإشعارات ──
// أضف هذه المفاتيح داخل كل كائن ترجمة (T.ar / T.ku / T.en):
// noNotif: 'لا توجد إشعارات'
// notifInboxTitle: 'إشعارات من المركز'
// notifMarkRead: 'تحديد الكل كمقروء'
</script>
